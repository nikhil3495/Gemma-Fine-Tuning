# REAL smoke fine-tune on CPU: Gemma 3 270M IT + LoRA r=8, ~2k examples, 400 optimizer steps.
# Memory-safe: micro-batch 1 x grad-accum 4 (effective batch 4), seq 256, eval batch 1.
# python -m recipe_gemma.train --config configs/train_smoke.yaml
run_name: smoke
seed: 1234

data:
  profile: smoke
  train: data/processed/smoke/train.jsonl
  val: data/processed/smoke/val.jsonl
  drop_overlength: true     # keep only examples whose full target fits in seq_len
  max_val: 48               # applied after length filtering

model:
  # Ungated redistribution of google/gemma-3-270m-it (Gemma Terms of Use). With Kaggle creds,
  # the equivalent official preset is `gemma3_instruct_270m`.
  preset: hf://unsloth/gemma-3-270m-it
  dtype: null               # float32 on CPU (bf16 matmuls are slower on this CPU)

lora:
  rank: 8

train:
  seq_len: 256
  batch_size: 1
  grad_accum_steps: 4
  max_steps: 400
  eval_every: 50
  log_every: 10
  lr: 2.0e-4
  warmup_steps: 20
  min_lr_ratio: 0.1
  weight_decay: 0.01
  grad_clip: 1.0
  early_stopping_patience: 2
  eval_batch_size: 1
  mixed_precision: null

out:
  dir: checkpoints/smoke
  results: results/train_smoke.json
  log_csv: results/train_smoke_log.csv
  tensorboard: runs/smoke

hub:
  repo_id: nikhil3495/gemma-recipe-lora
