[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-gemma"
version = "1.0.0"
description = "LoRA fine-tuning of Gemma (Keras 3 + JAX) for recipe and flavor-pairing generation, benchmarked against base Gemma and zero-shot Gemini."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
authors = [{ name = "Nikhil Bansiwal" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
train = [
  "jax==0.12.1",
  "keras==3.15.1",
  "keras-hub==0.33.0",
  "huggingface_hub>=1.0",
  "tensorboard>=2.17",
  "psutil>=5.9",
]
eval = [
  "matplotlib>=3.8",
  "google-genai>=1.0",
]
app = [
  "gradio>=5.0",
]
gcp = [
  "google-cloud-aiplatform>=1.60",
]
dev = [
  "pytest>=8",
  "psutil>=5.9",
  "ruff>=0.6",
]

[project.scripts]
recipe-gemma = "recipe_gemma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "app", "annotation"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Markdown report templates read more clearly as single long f-strings.
"src/recipe_gemma/eval/report.py" = ["E501"]
"scripts/make_model_card.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs keras/jax (tiny random model); still offline"]
